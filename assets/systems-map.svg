<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured systems map</title><desc id="desc">Four connected project nodes: OmniTrace, TrustChain, Calm Mate, and BITS CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#030812"/><stop offset="0.5" stop-color="#06101E"/><stop offset="1" stop-color="#030812"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#7DD3FC" stroke-opacity="0.07"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wire{stroke:#1687BA;stroke-width:1.5;stroke-dasharray:8 10;animation:flow 1.2s linear infinite}.node{fill:#07111F;stroke:#1D8DC1;stroke-width:1.5}.sub{font-size:12px;letter-spacing:1.4px;fill:#67819D}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/><rect width="1200" height="430" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="428" rx="21" stroke="#1D8DC1" stroke-opacity="0.8"/>
  <text x="40" y="52" class="mono" font-size="14" letter-spacing="2" fill="#22D3EE">03 // SYSTEMS MAP</text><text x="1040" y="52" class="mono pulse" font-size="12" fill="#34D399">● LINKED</text>
  <path d="M257 170L463 116M257 170L514 310M684 310L943 170M737 116L943 170M600 129V287" class="wire"/>
  <g filter="url(#glow)"><circle cx="600" cy="215" r="8" fill="#22D3EE"/><circle cx="600" cy="215" r="21" stroke="#22D3EE" stroke-opacity=".35" class="pulse"/></g>
  <g transform="translate(88 117)"><rect width="338" height="106" rx="16" class="node"/><text x="24" y="42" class="sans" font-size="22" font-weight="700" fill="#EFF8FF">OMNITRACE</text><text x="24" y="71" class="mono sub">MULTIMODAL / EVIDENCE / RAG</text><circle cx="309" cy="28" r="5" fill="#34D399" class="pulse"/></g>
  <g transform="translate(431 64)"><rect width="338" height="106" rx="16" class="node"/><text x="24" y="42" class="sans" font-size="22" font-weight="700" fill="#EFF8FF">TRUSTCHAIN</text><text x="24" y="71" class="mono sub">AGENTS / INTEGRITY / ON-CHAIN</text><circle cx="309" cy="28" r="5" fill="#34D399" class="pulse"/></g>
  <g transform="translate(431 260)"><rect width="338" height="106" rx="16" class="node"/><text x="24" y="42" class="sans" font-size="22" font-weight="700" fill="#EFF8FF">CALM MATE</text><text x="24" y="71" class="mono sub">AI / LEARNING / PRODUCT</text><circle cx="309" cy="28" r="5" fill="#22D3EE" class="pulse"/></g>
  <g transform="translate(774 117)"><rect width="338" height="106" rx="16" class="node"/><text x="24" y="42" class="sans" font-size="22" font-weight="700" fill="#EFF8FF">BITS CLI</text><text x="24" y="71" class="mono sub">C / LINUX / SYSTEMS</text><circle cx="309" cy="28" r="5" fill="#22D3EE" class="pulse"/></g>
  <text x="40" y="399" class="mono" font-size="11" letter-spacing="1.3" fill="#53657A">TELEMETRY: FOUR ACTIVE NODES / CONNECTION INTEGRITY 100%</text>
</svg>
