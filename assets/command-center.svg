<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shreshtha command center</title>
  <desc id="desc">A cinematic command-center interface introducing Shreshtha, a software engineer, system builder, and AI native.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02050B"/>
      <stop offset="0.5" stop-color="#050A14"/>
      <stop offset="1" stop-color="#07162B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(965 215) rotate(90) scale(230)">
      <stop stop-color="#0EA5E9" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#7DD3FC" fill-opacity="0.24"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal"><rect x="79" y="337" width="760" height="90"><animate attributeName="width" values="760;760;0;760" keyTimes="0;0.76;0.86;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font-size:13px;letter-spacing:2px}.muted{fill:#7389A4}.pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1.2s step-end infinite}.drift{animation:drift 6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes blink{50%{opacity:0}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="620" rx="28" fill="url(#glow)"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="#030812" fill-opacity="0.88" stroke="#1D8DC1" stroke-width="1.5"/>
  <path d="M34 102V58C34 44.7 44.7 34 58 34H120M1080 34H1142C1155.3 34 1166 44.7 1166 58V102M1166 518V562C1166 575.3 1155.3 586 1142 586H1080M120 586H58C44.7 586 34 575.3 34 562V518" stroke="#38BDF8" stroke-width="3"/>
  <rect x="35" y="-70" width="1130" height="170" fill="url(#scan)" opacity="0.8"><animate attributeName="y" values="-170;620" dur="6.5s" repeatCount="indefinite"/></rect>
  <g class="mono label">
    <text x="70" y="76" fill="#7DD3FC">SHRESHTHA / GITHUB</text>
    <text x="990" y="76" fill="#34D399">● SYSTEM ONLINE</text>
    <text x="70" y="133" fill="#22D3EE">01 // IDENTITY CORE</text>
    <text x="1064" y="548" fill="#53657A">SYS.280407</text>
  </g>
  <g class="drift">
    <text x="74" y="244" class="sans" font-size="76" font-weight="800" letter-spacing="5" fill="#F3F8FF">SHRESHTHA</text>
    <text x="78" y="286" class="mono" font-size="17" letter-spacing="2.8" fill="#8BA3BE">SOFTWARE ENGINEER  •  SYSTEM BUILDER  •  AI NATIVE</text>
    <g clip-path="url(#reveal)">
      <text x="78" y="367" class="sans" font-size="30" fill="#AABAD0">I design systems that feel</text>
      <text x="78" y="410" class="sans" font-size="35" font-weight="700" fill="#F3F8FF">alive, observable &amp; intentional.</text>
    </g>
    <rect x="690" y="338" width="3" height="81" rx="1.5" fill="#34D399" class="blink"/>
  </g>
  <g transform="translate(978 266)" filter="url(#softGlow)">
    <circle r="130" stroke="#1996D1" stroke-width="1.5"/><circle r="91" stroke="#1996D1" stroke-width="1.2" stroke-opacity="0.85"/><circle r="54" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.75"/><path d="M-146 0H146M0-146V146" stroke="#1885B8" stroke-opacity="0.55"/>
    <g>
      <circle cx="0" cy="-130" r="5" fill="#67E8F9"/><circle cx="92" cy="-92" r="5" fill="#67E8F9"/><circle cx="130" cy="0" r="5" fill="#67E8F9"/><circle cx="92" cy="92" r="5" fill="#67E8F9"/><circle cx="0" cy="130" r="5" fill="#67E8F9"/><circle cx="-92" cy="92" r="5" fill="#67E8F9"/><circle cx="-130" cy="0" r="5" fill="#67E8F9"/><circle cx="-92" cy="-92" r="5" fill="#67E8F9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </g>
    <circle r="12" fill="#22D3EE" fill-opacity="0.16" class="pulse"/><circle r="4" fill="#67E8F9"/>
  </g>
  <g class="mono" font-size="12">
    <g transform="translate(75 468)"><rect width="190" height="75" rx="10" fill="#07111F" stroke="#154D70"/><text x="18" y="27" class="muted">PUBLIC SYSTEMS</text><text x="18" y="56" font-size="22" font-weight="700" fill="#E6F7FF">18</text></g>
    <g transform="translate(281 468)"><rect width="190" height="75" rx="10" fill="#07111F" stroke="#154D70"/><text x="18" y="27" class="muted">ACTIVE MODE</text><text x="18" y="56" font-size="22" font-weight="700" fill="#E6F7FF">BUILD</text></g>
    <g transform="translate(487 468)"><rect width="190" height="75" rx="10" fill="#07111F" stroke="#154D70"/><text x="18" y="27" class="muted">SIGNAL</text><text x="18" y="56" font-size="22" font-weight="700" fill="#34D399">NOMINAL</text></g>
    <text x="755" y="502" fill="#53657A">UPLINK</text><rect x="755" y="517" width="330" height="5" rx="2.5" fill="#10283C"/><rect x="755" y="517" width="72" height="5" rx="2.5" fill="#22D3EE"><animate attributeName="width" values="72;330;210;300;72" dur="5s" repeatCount="indefinite"/></rect>
  </g>
</svg>
