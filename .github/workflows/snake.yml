name: Generate contribution animation

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shreshtha280407
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306b6d4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%23050a14,%230c3446,%230e7490,%2306b6d4,%2367e8f9

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
